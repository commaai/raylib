name: Python bindings

on:
  pull_request:
    paths: ['src/**', 'python/**', 'setup.py', 'pyproject.toml', 'MANIFEST.in', '.github/workflows/python.yml']
  push:
    branches: [master]
    paths: ['src/**', 'python/**', 'setup.py', 'pyproject.toml', 'MANIFEST.in', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libgbm-dev libdrm-dev
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build --sdist
          python -m pip wheel --no-deps dist/*.tar.gz -w wheelhouse
      - name: Install wheel without runtime dependencies
        run: python -m pip install --no-deps wheelhouse/*.whl
      - name: Test installed package
        env:
          RAYLIB_BACKEND: ${{ runner.os == 'Linux' && 'headless' || 'desktop' }}
          EGL_PLATFORM: surfaceless
          RAYLIB_TEST_RENDER: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: python -m unittest discover -s python/tests -v
