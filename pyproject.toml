[build-system]
requires = ["setuptools>=77", "nanobind==3.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raylib-nanobind"
version = "6.0.0.0"
description = "Direct nanobind bindings for raylib UI applications"
requires-python = ">=3.9"
license = "Zlib AND BSD-3-Clause AND MIT"
license-files = ["LICENSE"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["raylib_nb"]
include-package-data = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
